<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect width="32" height="32" rx="8" fill="#09090b"/>
  <!-- Subtle inner border for contrast -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#27272a" stroke-width="1"/>
  
  <!-- Candlestick upper and lower wick for the 'L' stem -->
  <line x1="10.5" y1="5.5" x2="10.5" y2="8" stroke="#10b981" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="10.5" y1="20" x2="10.5" y2="23" stroke="#10b981" stroke-width="1.75" stroke-linecap="round"/>
  
  <!-- Letter L vertical candlestick body in pure crisp white -->
  <rect x="9" y="8" width="3" height="12" rx="1" fill="#ffffff"/>
  
  <!-- Letter L horizontal base connecting to an upward growth tick in emerald -->
  <path d="M12 18.5H19.5C20.6 18.5 21.5 17.6 21.5 16.5V12" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21.5" cy="10.5" r="1.5" fill="#34d399"/>
</svg>
